[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conveyance-mil"
version = "0.1.0"
description = "Modular MIL research project with Conveyance loss."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name"}]

dependencies = [
  "torch>=2.0",
  "numpy>=1.23",
  "PyYAML>=6.0",
  "tqdm>=4.66"
]

[project.optional-dependencies]
torchmil = ["torchmil>=0.2.0"]

test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
