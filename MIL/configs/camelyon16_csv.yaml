seed: 0

camelyon16_csv:
  dataset:
    manifest: /path/to/Camelyon16_MIL/Camelyon16.csv
    dataset_root: /path/to/Camelyon16_MIL
  model:
    in_shape: [512]          
    num_classes: 2
    dropout: 0.1
    shared_dim: 256
    inst_head_num_layers: 2
  train:
    epochs: 40
    lr: 0.0002
    weight_decay: 0.0001
    max_grad_norm: 1.0
    device: cuda
    scheduler:
      type: constant          
      eta_min: 0.000001
  runs: 5
  n_folds: 5
  log_every: 10         